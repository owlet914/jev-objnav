defaults:
  - /benchmark/nav/objectnav:
      - objectnav_hm3d
  - _self_

habitat_baselines:
  evaluate: True
  force_torch_single_threaded: True

habitat:
  dataset:
    type: ObjectNav-v1
    split: pilot
    data_path: data/datasets/objectnav/ovon_small/{split}/{split}.json.gz
  environment:
    max_episode_steps: 500
    iterator_options:
      cycle: false
      shuffle: false
      max_scene_repeat_steps: 10000000
  task:
    lab_sensors:
      gps_sensor:
        type: GPSSensor
        dimensionality: 3
    measurements:
      success:
        success_distance: 0.25
  simulator:
    habitat_sim_v0:
      allow_sliding: false
      # WSL exposes the render device through EGL without a matching CUDA
      # ordinal. Let Habitat-Sim select that EGL device automatically; native
      # Linux multi-GPU runs can override this with an explicit nonnegative ID.
      gpu_device_id: -1
    forward_step_size: 0.25
    turn_angle: 30
    agents:
      main_agent:
        radius: 0.18
        sim_sensors:
          depth_sensor:
            min_depth: 0.0
            max_depth: 5.0
            normalize_depth: true

detector:
  yolo:
    confidence_threshold_yolo: 0.3
    iou_threshold_yolo: 0.5
    agnostic_nms: True
  groundingDINO:
    confidence_threshold_dino: 0.40
    text_threshold: 0.25

llm:
  llm_answer_path: llm/answers/llm_answer_ovon.txt
  llm_response_path: llm/answers/llm_response_ovon.txt
  llm_client:
    llm_client: none
    ollama: "qwen3:8b"

record_file_name: "record.txt"
continue_file_name: "continue.txt"
need_video: false
video_output_path: "videos/test_ovon_{split}"
test_epi_num: -1
eval_episode_limit: -1
